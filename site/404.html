<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="title">Not found | map0</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/demos/demo.css" />
    <link rel="stylesheet" href="/landing.css" />
    <!-- deliberately no module script: a 404 should cost a stylesheet, not a map engine -->
  </head>
  <body class="landing error-page">
    <!-- the shared topbar is injected by vite.config.ts on every page -->

    <header class="hero">
      <div class="wrap">
        <p class="eyebrow" data-i18n="eyebrow"><b>404</b>&nbsp;· page not found</p>
        <h1 class="wordmark">4<span>0</span>4</h1>
        <p class="subtitle" data-i18n="subtitle">Page not found</p>
        <p class="lede" data-i18n="lede">
          This address is unavailable. Continue to the home page or browse the demos.
        </p>
        <div class="actions">
          <a class="btn primary" href="/" data-i18n="back">Back to the start</a>
          <a class="btn ghost" href="/demos/" data-i18n="demos">Browse the demos →</a>
        </div>
      </div>
    </header>

    <!-- the shared footer is injected by vite.config.ts on every page -->
  </body>
</html>
