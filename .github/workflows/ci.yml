name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke # component lifecycle + z-order in a real browser, on the BUILT bundle
      - run: pnpm size # fails when the eager bundle outgrows its budget (N1)
      - run: pnpm build:site # the deployed site — a broken site build must fail here, not on deploy
      # The live-service E2E pass (e2e/verify-demos.mjs) stays local/manual: it
      # drives real SDI services, so a red run would mean "someone else's server
      # is down". Everything that can be made deterministic lives in pnpm smoke.
